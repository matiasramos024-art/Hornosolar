<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoreo del Horno</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="contenedor">

    <h1>HORNO SOLAR PARA SECADO DE MADERA</h1>

    <!-- Mensaje de espera -->

    <div id="espera">

        <h2>Esperando datos del horno...</h2>

        <p>Conectando con Firebase...</p>

    </div>

    <!-- Instrumentos -->

    <div class="instrumentos" id="instrumentos" style="display:none;">

        <!-- Panel Temperatura -->

        <div class="temperatura">

            <h2>🌡 TEMPERATURA</h2>

            <div class="panelInstrumento">

                <canvas id="velocimetro" width="320" height="220"></canvas>

                <p id="valorTemp">0.0 °C</p>

            </div>

        </div>

        <!-- Panel Humedad -->

        <div class="humedad">

            <h2>💧 HUMEDAD</h2>

            <div class="panelInstrumento">

                <div class="tanque">

                    <div id="agua"></div>

                </div>

                <p id="valorHum">0 %</p>

            </div>

        </div>

    </div>

    <!-- Estado -->

    <div class="panelEstado">

        <span class="ledEstado"></span>

        <h2 id="estado">APAGADO</h2>

    </div>

    <!-- Botón -->

    <div class="panelBoton">

        <button id="btnApagar" class="rojo">

            APAGAR

        </button>

    </div>

</div>

<script type="module" src="monitor.js"></script>

</body>

</html>
